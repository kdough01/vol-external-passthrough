name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Dependencies
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config ninja-build \
            libhdf5-dev hdf5-tools libbz2-dev nlohmann-json3-dev

      - name: Debug HDF5 install paths
        run: |
          echo "=== find H5VLpublic.h ==="
          find /usr -name "H5VLpublic.h" 2>/dev/null
          echo "=== pkg-config hdf5 ==="
          pkg-config --cflags --libs hdf5 2>/dev/null || echo "pkg-config hdf5 not found"
          echo "=== HDF5 serial include ==="
          ls /usr/include/hdf5/serial/ | head -5

      - name: Build std_compat
        run: |
          git clone --depth=1 https://github.com/robertu94/std_compat.git /tmp/std_compat
          cmake -S /tmp/std_compat -B /tmp/std_compat/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_TESTING=OFF
          sudo cmake --build /tmp/std_compat/build -j$(nproc)
          sudo cmake --install /tmp/std_compat/build

      - name: Build libpressio
        run: |
          git clone --depth=1 https://github.com/robertu94/libpressio.git /tmp/libpressio
          cmake -S /tmp/libpressio -B /tmp/libpressio/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON \
            -DLIBPRESSIO_HAS_SZ3=OFF \
            -DLIBPRESSIO_HAS_BZIP2=ON \
            -DLIBPRESSIO_HAS_ZFP=OFF \
            -DLIBPRESSIO_HAS_JSON=ON \
            -DLIBPRESSIO_HAS_MPI=OFF \
            -DLIBPRESSIO_HAS_CUDA=OFF
          sudo cmake --build /tmp/libpressio/build -j$(nproc)
          sudo cmake --install /tmp/libpressio/build
          sudo ldconfig

      # Build the VOL connector
      - name: Configure
        run: |
          HDF5_SERIAL_INC=$(dpkg -L libhdf5-dev | grep -m1 "serial/hdf5.h$" | xargs dirname)
          HDF5_SERIAL_LIB=$(dpkg -L libhdf5-dev | grep -m1 "serial/libhdf5.so$" | xargs dirname)
          echo "HDF5 include: $HDF5_SERIAL_INC"
          echo "HDF5 lib:     $HDF5_SERIAL_LIB"
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=gcc \
            -DUSE_CUDA=OFF \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DCMAKE_BUILD_TYPE=Release \
            -DHDF5_INCLUDE_DIRS="$HDF5_SERIAL_INC" \
            -DHDF5_LIBRARIES="$HDF5_SERIAL_LIB/libhdf5.so" \
            -DCMAKE_C_FLAGS="-I$HDF5_SERIAL_INC"

      - name: Build
        run: cmake --build build -j$(nproc)

      # Tests
      - name: Run CI tests
        run: |
          export HDF5_VOL_CONNECTOR="pass_through_ext under_vol=0;under_info={}"
          export HDF5_PLUGIN_PATH="$(pwd)/build"
          ./build/tests/test_ci

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/test_ci_*.h5
          retention-days: 7