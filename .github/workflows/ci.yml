name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dagger SDK
        run: pip install dagger-io==0.21.5

      - name: Install Dagger CLI
        run: |
          cd /usr/local
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.5 sh

      - name: Run Dagger pipeline
        run: python3 ci/main.py

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/test_ci_*.h5
          retention-days: 7