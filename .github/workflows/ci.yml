name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-22.04
    permissions:
      packages: write
    env:
      GITHUB_USER: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout vol-external-passthrough
        uses: actions/checkout@v4

      - name: Checkout robertu94 spack packages
        uses: actions/checkout@v4
        with:
          repository: robertu94/spack_packages
          path: ./robertu94_packages
          ref: v1.2.3

      - name: System MPI for the test targets
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Set up Spack
        uses: spack/setup-spack@v3
        with:
          spack_ref: releases/v0.23
          buildcache: true

      - name: Add robertu94 package repo
        shell: spack-bash {0}
        run: |
          REPO_YAML=$(find ./robertu94_packages -name 'repo.yaml' -not -path '*/.git/*' | head -n1)
          spack repo add "$(dirname "$REPO_YAML")"
          spack repo list

      - name: Concretize
        shell: spack-bash {0}
        run: spack -e . concretize

      - name: Install dependencies
        shell: spack-bash {0}
        run: spack -e . install --no-check-signature

      - name: Configure, build, test
        shell: spack-bash {0}
        run: |
          spack env activate .
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          export HDF5_VOL_CONNECTOR="pass_through_ext under_vol=0;under_info={}"
          export HDF5_PLUGIN_PATH="$(pwd)/build"
          ./build/tests/test_ci

      - name: Push deps to buildcache
        if: ${{ !cancelled() && github.ref == 'refs/heads/develop' }}
        shell: spack-bash {0}
        run: spack -e . buildcache push --base-image ubuntu:22.04 --update-index local-buildcache

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/test_ci_*.h5
          retention-days: 7