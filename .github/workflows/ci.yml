name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout vol-external-passthrough
        uses: actions/checkout@v4

      - name: Checkout spack
        uses: actions/checkout@v4
        with:
          repository: spack/spack
          ref: releases/v0.23
          path: ./spack

      - name: Checkout robertu94 spack packages
        uses: actions/checkout@v4
        with:
          repository: robertu94/spack_packages
          path: ./robertu94_packages

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config ninja-build \
            python3 python3-pip

      - name: Install dependencies via spack
        run: |
          . ./spack/share/spack/setup-env.sh
          spack repo add ./robertu94_packages
          spack repo list
          # Install just the deps we need — HDF5, std_compat, and libpressio
          # with the compressors that match what the VOL connector supports.
          spack install \
            hdf5@1.14 \
            libpressio+bzip2+json~mpi~cuda~zfp ^std_compat

      - name: Configure
        run: |
          . ./spack/share/spack/setup-env.sh
          spack load hdf5 libpressio std_compat
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=gcc \
            -DUSE_CUDA=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          . ./spack/share/spack/setup-env.sh
          spack load hdf5 libpressio std_compat
          cmake --build build -j$(nproc)

      - name: Run CI tests
        run: |
          . ./spack/share/spack/setup-env.sh
          spack load hdf5 libpressio std_compat
          export HDF5_VOL_CONNECTOR="pass_through_ext under_vol=0;under_info={}"
          export HDF5_PLUGIN_PATH="$(pwd)/build"
          ./build/tests/test_ci

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/test_ci_*.h5
          retention-days: 7